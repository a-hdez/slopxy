[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "slopxy"
version = "0.1.0"
description = "Generate Magic: The Gathering proxy card images, with optional AI art."
readme = "README.md"
license = "Unlicense"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10",
    "numpy>=1.24",
]

[project.scripts]
slopxy = "slopxy.cli:main"

# The repository root is the slopxy package (flat layout), so `import slopxy` needs an install:
# pip install -e .
[tool.setuptools]
packages = ["slopxy", "slopxy.art", "slopxy.art.backends"]
package-dir = {"slopxy" = "."}

[tool.setuptools.package-data]
"slopxy" = ["assets/*.svg"]
"slopxy.art.backends" = ["workflows/*.json"]
