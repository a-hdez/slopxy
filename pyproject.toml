[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "slopxy"
version = "0.1.0"
description = "Generate Magic: The Gathering proxy card images, with optional AI art."
readme = "README.md"
license = "Unlicense"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.1",  # ImageFont.load_default(size)
    "numpy>=1.24",
    "tomli>=1.1; python_version < '3.11'",
]

# Hosted art backends; ComfyUI, Automatic1111/Forge and the placeholder need none of these.
[project.optional-dependencies]
openai = ["openai>=3.49"]
gemini = ["google-genai>=3.0"]
anthropic = ["anthropic>=2.8"]
all = ["openai>=3.49", "google-genai>=3.0", "anthropic>=2.8"]

[project.scripts]
slopxy = "slopxy.cli:main"

# The repository root is the slopxy package (flat layout), so `import slopxy` needs an install:
# pip install -e .
[tool.setuptools]
packages = ["slopxy", "slopxy.art", "slopxy.art.backends"]
package-dir = {"slopxy" = "."}

[tool.setuptools.package-data]
"slopxy" = ["assets/*.svg"]
"slopxy.art.backends" = ["workflows/*.json"]
